<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
</head>
<body>

<h2>WebSocket Chat Test</h2>

<input id="token" placeholder="JWT Token" size="60"><br><br>
<input id="room" value="abc123"><br><br>

<button id="connectBtn">Connect</button>
<button id="sendBtn">Send</button><br><br>

<input id="message" placeholder="Type message"><br><br>

<div id="chat"></div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
let stompClient = null;

document.getElementById("connectBtn").addEventListener("click", function () {
    console.log("🔥 Connect button clicked");

    const token = document.getElementById("token").value;
    const room = document.getElementById("room").value;

    console.log("Token:", token);
    console.log("Room:", room);
const socket = new WebSocket("ws://localhost:8000/chat/ws");
stompClient = Stomp.over(socket);
    console.log("Socket created");

    stompClient = Stomp.over(socket);

    stompClient.debug = function(str) {
        console.log("STOMP:", str);
    };

    stompClient.connect(
        { Authorization: "Bearer " + token },
        function () {
            console.log("✅ CONNECTED");

            stompClient.subscribe("/topic/" + room, function (msg) {
                console.log("📩 Message:", msg.body);
                addMessage(msg.body);
            });
        },
        function (error) {
            console.log("❌ ERROR:", error);
        }
    );
});

document.getElementById("sendBtn").addEventListener("click", function () {
    console.log("📤 Send clicked");

    const room = document.getElementById("room").value;
    const message = document.getElementById("message").value;

    stompClient.send("/app/chat.send", {}, JSON.stringify({
        roomCode: room,
        content: message
    }));
});

function addMessage(msg) {
    const div = document.getElementById("chat");
    div.innerHTML += "<div>" + msg + "</div>";
}
</script>

</body>
</html>
